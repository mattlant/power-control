[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-client"
version = "0.1.0"
description = "Typed Python client and CLI for power-control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]
license = { text = "MIT" }

[project.scripts]
powerctl = "power_client.cli:main"

[project.optional-dependencies]
test = ["trustme>=1.1,<2"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

