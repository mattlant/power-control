socket_path = "/run/power-service/broker.sock"
api_uid = <POWER_SERVICE_API_UID>
gpu_index = 0
query_timeout_seconds = 5
operation_timeout_seconds = 5

[automatic_suspend]
enabled = true
interactive_sessions_enabled = false
interactive_activity_timeout_seconds = 60
max_lease_ttl_seconds = 3600
stable_idle_seconds = 3600
grace_seconds = 60
evaluation_interval_seconds = 10
max_status_principals = 20
local_activity_probes = [
  { kind = "process_name", name = "<PROCESS_NAME>" },
  { kind = "tcp_listener", port = <PORT> },
]

[[profiles]]
name = "quiet"
[profiles.cpu]
policy_ids = [<POLICY_IDS>]
governor = "<GOVERNOR>"
min_khz = <MIN_KHZ>
max_khz = <MAX_KHZ>
epp = "<EPP>"
[profiles.gpu]
power_limit_w = "<POWER_LIMIT_W>"

[[profiles]]
name = "performance"
[profiles.cpu]
policy_ids = [<POLICY_IDS>]
governor = "<GOVERNOR>"
min_khz = <MIN_KHZ>
max_khz = <MAX_KHZ>
epp = "<EPP>"
[profiles.gpu]
power_limit_w = "<POWER_LIMIT_W>"

